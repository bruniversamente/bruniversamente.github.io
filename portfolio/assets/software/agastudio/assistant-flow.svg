<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810"><rect width="1440" height="810" fill="#121212"/><g font-family="Inter,Arial,sans-serif"><text x="48" y="70" fill="#eee" font-size="36">Assistentes · contexto, ferramentas e revisão</text><rect x="48" y="140" width="640" height="180" fill="none" stroke="#666"/><text x="72" y="182" fill="#eee" font-size="27">Contexto do projeto</text><text x="72" y="222" fill="#aaa" font-size="20">Projeto e canal de trabalho</text><text x="72" y="253" fill="#aaa" font-size="20">Arquivos autorizados e solicitação</text><rect x="752" y="140" width="640" height="180" fill="none" stroke="#666"/><text x="776" y="182" fill="#eee" font-size="27">Adaptadores de IA</text><text x="776" y="222" fill="#aaa" font-size="20">Interface comum de mensagens e eventos</text><text x="776" y="253" fill="#aaa" font-size="20">Autenticação e histórico por fornecedor</text><path d="M688 230H752M1072 320V390H720" stroke="#888" fill="none"/><rect x="48" y="390" width="1344" height="180" fill="none" stroke="#666"/><text x="72" y="432" fill="#eee" font-size="27">Ferramentas controladas pelo AGAStudio</text><text x="72" y="472" fill="#aaa" font-size="20">O programa confere pasta, parâmetros, limites e confirmação exigida pela ação.</text><text x="72" y="503" fill="#aaa" font-size="20">Ler e criar têm condições próprias; substituir, mover ou excluir exigem revisão.</text><path d="M720 570V635" stroke="#888" fill="none"/><rect x="48" y="635" width="1344" height="110" fill="none" stroke="#666"/><text x="72" y="677" fill="#eee" font-size="27">Resultado e conferência</text><text x="72" y="717" fill="#aaa" font-size="20">A interface apresenta o estado da tarefa e o profissional confere a entrega.</text></g></svg>