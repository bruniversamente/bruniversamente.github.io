<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="610" viewBox="0 0 1440 610"><rect width="1440" height="610" fill="#121212"/><g font-family="Inter,Arial,sans-serif"><text x="48" y="70" fill="#eee" font-size="36">Da rodada à prancha técnica</text><rect x="48" y="142" width="400" height="200" fill="none" stroke="#666"/><text x="72" y="184" fill="#eee" font-size="27">Dados e rodada</text><text x="72" y="224" fill="#aaa" font-size="20">Coordenadas e cotas</text><text x="72" y="255" fill="#aaa" font-size="20">Referências e geometria</text><rect x="520" y="142" width="400" height="200" fill="none" stroke="#666"/><text x="544" y="184" fill="#eee" font-size="27">Composição CAD</text><text x="544" y="224" fill="#aaa" font-size="20">Componentes e camadas</text><text x="544" y="255" fill="#aaa" font-size="20">Planta, perfil e anotações</text><rect x="992" y="142" width="400" height="200" fill="none" stroke="#666"/><text x="1016" y="184" fill="#eee" font-size="27">Conferência</text><text x="1016" y="224" fill="#aaa" font-size="20">Fontes e entidades</text><text x="1016" y="255" fill="#aaa" font-size="20">Versão, origem e entrega</text><path d="M448 242H520M920 242H992" stroke="#888" fill="none"/><text x="48" y="417" fill="#aaa" font-size="22">O desenho e sua conferência precisam corresponder à mesma rodada.</text><text x="48" y="466" fill="#888" font-size="20">Diagrama explicativo do fluxo; não é uma prancha CAD nem uma prova de fidelidade visual.</text><text x="48" y="520" fill="#888" font-size="20">O exemplo PBZPH desta apresentação conserva pendências identificadas na interface.</text></g></svg>