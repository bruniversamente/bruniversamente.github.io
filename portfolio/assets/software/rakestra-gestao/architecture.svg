<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="950" viewBox="0 0 1440 950"><rect width="1440" height="950" fill="#121212"/><g font-family="Inter,Segoe UI,sans-serif"><text x="48" y="67" font-size="36" fill="#eee">Rakestra Gestão · interfaces, regras e dados</text><text x="48" y="111" font-size="20" fill="#aaa">Visão lógica da implementação · a experiência pública e a equipe compartilham referências operacionais.</text><rect x="48" y="165" width="400" height="190" fill="none" stroke="#777"/><text x="72" y="207" font-size="26" fill="#eee">Gestão web</text><text x="72" y="248" font-size="19" fill="#aaa">Equipe e administração</text><text x="72" y="277" font-size="19" fill="#aaa">React · Next.js · TypeScript</text><text x="72" y="306" font-size="19" fill="#aaa">Clube, unidade e permissões</text><rect x="520" y="165" width="400" height="190" fill="none" stroke="#777"/><text x="544" y="207" font-size="26" fill="#eee">Site de reservas</text><text x="544" y="248" font-size="19" fill="#aaa">Cliente do estabelecimento</text><text x="544" y="277" font-size="19" fill="#aaa">Website responsivo</text><text x="544" y="306" font-size="19" fill="#aaa">Disponibilidade e confirmação</text><rect x="992" y="165" width="400" height="190" fill="none" stroke="#777"/><text x="1016" y="207" font-size="26" fill="#eee">Gestão Mobile</text><text x="1016" y="248" font-size="19" fill="#aaa">Aplicativo profissional separado</text><text x="1016" y="277" font-size="19" fill="#aaa">Navegação e contexto de unidade</text><text x="1016" y="306" font-size="19" fill="#aaa">Capacidades da versão própria</text><path d="M248 355V415H720M720 355V465M1192 355V415H720V465" stroke="#999" fill="none"/><text x="750" y="448" font-size="18" fill="#aaa">consultas e comandos autenticados</text><rect x="48" y="465" width="1344" height="180" fill="none" stroke="#777"/><text x="72" y="507" font-size="26" fill="#eee">API e regras da operação</text><text x="72" y="548" font-size="19" fill="#aaa">Acesso por clube e unidade · disponibilidade e ocupação · associação, aulas e competição</text><text x="72" y="577" font-size="19" fill="#aaa">Confirmação de reservas · origem das cobranças · histórico e identificação das operações</text><path d="M450 645V710M1010 645V710" stroke="#999" fill="none"/><rect x="48" y="710" width="640" height="160" fill="none" stroke="#777"/><text x="72" y="752" font-size="26" fill="#eee">Persistência · MongoDB</text><text x="72" y="793" font-size="19" fill="#aaa">Clubes, unidades, quadras e participantes</text><text x="72" y="822" font-size="19" fill="#aaa">Reservas, cobranças, eventos e comprovantes</text><rect x="752" y="710" width="640" height="160" fill="none" stroke="#777"/><text x="776" y="752" font-size="26" fill="#eee">Integrações e processamento</text><text x="776" y="793" font-size="19" fill="#aaa">Pagamentos e notificações</text><text x="776" y="822" font-size="19" fill="#aaa">Responsabilidades específicas de cada integração</text><text x="48" y="920" font-size="18" fill="#999">O diagrama organiza responsabilidades; não representa topologia de produção ou garantia de disponibilidade.</text></g></svg>